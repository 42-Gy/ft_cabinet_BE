name: 🤖 챗봇 모델 평가 / 고정

# 챗봇 임베딩 모델(minilm, e5)을 Hugging Face 에서 내려받아 평가 질문 세트로 비교하고,
# lock 파일(chatbot-models.lock)에 고정할 revision/SHA256 을 출력한다. 수동 실행 전용이다.
#
#  1) 이 작업을 실행한다 → 요약(Job summary)에 모델별 정확도 표와 "lock 파일에 고정할 값"이 나온다.
#  2) 더 나은 모델을 고르고, 출력된 meta/file 줄로 chatbot-models.lock 을 고쳐 커밋한다.
#  3) 표의 임계값 후보를 보고 CHATBOT_MATCH_THRESHOLD 등을 정한다.
# 이 작업은 운영 비밀을 쓰지 않는다(공개 모델 다운로드만).

on:
  workflow_dispatch:
    inputs:
      models:
        description: '평가할 모델 id (공백으로 구분, chatbot-models.lock 의 id)'
        required: false
        default: 'minilm e5'
      min_top1:
        description: '후보 모델이 넘어야 하는 top-1 정확도(0~1)'
        required: false
        default: '0.80'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      # resolve 모드: PENDING 인 revision 은 현재 커밋으로 풀고, SHA256 은 계산해서 출력한다.
      # 이미 고정된 값이 있으면 그 값과 다를 때 실패한다.
      - name: 📦 모델 내려받기 (resolve)
        env:
          MODELS: ${{ inputs.models }}
        run: |
          set -euo pipefail
          mkdir -p build/chatbot-models
          : > build/chatbot-models/pin.txt
          for id in $MODELS; do
            case "$id" in (*[!a-zA-Z0-9_-]*|'') echo "잘못된 모델 id: $id" >&2; exit 1 ;; esac
            bash scripts/chatbot/fetch-model.sh --mode resolve --id "$id" \
              --out "build/chatbot-models/$id" | tee -a build/chatbot-models/pin.txt
            echo >> build/chatbot-models/pin.txt
          done

      - name: 🧪 평가 실행
        env:
          CHATBOT_EVAL_MODELS_DIR: ${{ github.workspace }}/build/chatbot-models
          CHATBOT_EVAL_MIN_TOP1: ${{ inputs.min_top1 }}
        run: |
          chmod +x gradlew
          ./gradlew test --tests '*ChatbotRetrievalEvaluationTest' --no-daemon -i

      - name: 📝 요약 작성
        if: always()
        run: |
          {
            echo "## 챗봇 모델 평가"
            echo
            if [ -f build/chatbot-eval/report.md ]; then cat build/chatbot-eval/report.md; else echo "(리포트가 생성되지 않았습니다)"; fi
            echo
            echo "## chatbot-models.lock 에 고정할 값"
            echo '```'
            cat build/chatbot-models/pin.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-eval-report
          path: |
            build/chatbot-eval/report.md
            build/chatbot-models/pin.txt
          if-no-files-found: warn
