name: Build and Deploy to Azure Web App

# [테스트 포크] master push 자동 배포를 비활성화하고 수동 실행(workflow_dispatch)만 허용한다.
# 운영 레포로 머지하기 전에 이 트리거 변경은 원복할 것.
on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'subak-server-gs'
  JAVA_VERSION: '17'

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 자바 세팅 및 빌드 (생략 없이 기존과 동일)
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Slack Users CSV
        env:
          CSV_DATA: ${{ secrets.SLACK_USERS_CSV }}
        run: |
          mkdir -p src/main/resources
          echo "$CSV_DATA" > src/main/resources/slack_users.csv

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 2. Docker 로그인 및 빌드/푸시 (기존과 동일)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 3. Azure 로그인 (방금 만든 마스터 키 사용) 🚨 핵심 변경
      - name: 'Login via Azure CLI'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 4. Azure 웹앱으로 배포 (Docker Compose 방식)
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          configuration-file: docker-compose-azure.yml