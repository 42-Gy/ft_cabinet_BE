server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  tomcat:
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: optional:file:src/main/resources/secret.properties

  application:
    name: 42cabi-gyeongsan

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

  flyway:
    # 기본은 꺼 둔다. 설정 실수로 다른 DB(특히 운영)에서 마이그레이션이 조용히 실행되는 것을 막기 위해
    # 마이그레이션을 적용할 환경에서만 FLYWAY_ENABLED=true 로 명시한다.
    enabled: ${FLYWAY_ENABLED:false}
    # 기존 DB 의 baseline 은 사람이 수동으로 1회 실행한다. 자동 baseline 은 절대 켜지 않는다.
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never
      encoding: UTF-8

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:cabi}?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&useSSL=true&trustServerCertificate=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: CabiHikariPool
      maximum-pool-size: 30
      minimum-idle: 15
      connection-timeout: 30000
      initialization-fail-timeout: 0
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 15000

  jpa:
    # spring.jpa.defer-datasource-initialization 을 true 로 켜면 Flyway 와 entityManagerFactory 가 서로를 기다리는
    # 순환 의존이 생겨 FLYWAY_ENABLED=true 에서 부팅이 실패한다. 스키마는 Flyway 가 만들므로 켜지 않는다.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  security:
    oauth2:
      client:
        registration:
          42:
            client-id: ${FT_CLIENT_ID}
            client-secret: ${FT_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${FRONTEND_URL}/login/oauth2/code/42"
            scope: public
            client-name: 42 gyeongsan
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${FRONTEND_URL}/login/oauth2/code/kakao"
            scope: account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${FRONTEND_URL}/login/oauth2/code/google"
            scope: profile,email
        provider:
          42:
            authorization-uri: https://api.intra.42.fr/oauth/authorize
            token-uri: https://api.intra.42.fr/oauth/token
            user-info-uri: https://api.intra.42.fr/v2/me
            user-name-attribute: login
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

cabinet:
  policy:
    lent-term: 31
    extension-term: 3
  items:
    extension-price: 400
    swap-price: 1000
    penalty-exemption-price: 300

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    groups-order: desc
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, graphics, metrics, prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800000
  refresh-token-validity: 1209600000

auth:
  allowed-email-domain: 42gyeongsan.kr

slack:
  token: ${SLACK_BOT_TOKEN}

ai:
  server:
    url: ${AI_SERVER_URL:http://ai:8000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  client:
    connect-timeout: 20000
    read-timeout: 20000
  frontend:
    url: ${FRONTEND_URL}
  ft-api:
    root-url: https://api.intra.42.fr
    token-url: https://api.intra.42.fr/oauth/token

resilience4j:
  circuitbreaker:
    instances:
      aiServer:
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        slidingWindowSize: 5
  ratelimiter:
    instances:
      ftApi:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
      userApi:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
      storeApi:
        limitForPeriod: 3
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
      lentApi:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 0s

cloud:
  azure:
    storage:
      blob:
        container-name: locker-images
        connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
